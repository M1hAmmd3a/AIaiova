<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تكسي طولكرم - خدمة توصيل سريعة وآمنة</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #FFB800;
            --primary-dark: #E6A500;
            --secondary: #0A0E27;
            --accent: #FF6B6B;
            --accent-2: #4ECDC4;
            --success: #2ECC71;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --bg: #F8F9FC;
            --card-bg: #FFFFFF;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.12);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.15);
            --gradient-1: linear-gradient(135deg, #FFB800 0%, #FF8C00 100%);
            --gradient-2: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-3: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Hero */
        .hero {
            background: var(--secondary);
            color: white;
            padding: 3rem 1.5rem 4rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -20%;
            width: 150%; height: 200%;
            background: radial-gradient(circle, rgba(255,184,0,0.15) 0%, transparent 70%);
            animation: float 8s ease-in-out infinite;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0; right: 0;
            height: 80px;
            background: var(--bg);
            clip-path: polygon(0 50%, 100% 0, 100% 100%, 0 100%);
        }
        @keyframes float {
            0%, 100% { transform: translate(0,0) rotate(0deg); }
            33% { transform: translate(30px,-30px) rotate(5deg); }
            66% { transform: translate(-20px,20px) rotate(-5deg); }
        }
        .hero-content { position: relative; z-index: 1; }
        .taxi-icon-container { position: relative; display: inline-block; margin-bottom: 1.5rem; }
        .taxi-icon {
            font-size: 5rem;
            filter: drop-shadow(0 10px 30px rgba(255,184,0,0.4));
            animation: car-bounce 3s ease-in-out infinite;
        }
        @keyframes car-bounce {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        .taxi-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%,-50%);
            width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(255,184,0,0.3) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: translate(-50%,-50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
        }
        .hero h1 {
            font-size: 3rem; font-weight: 800; margin-bottom: 1rem;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-subtitle { font-size: 1.3rem; font-weight: 300; margin-bottom: 0.5rem; opacity: 0.9; }
        .hero p { font-size: 1.05rem; line-height: 1.8; margin-bottom: 0.5rem; opacity: 0.85; }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.2rem; margin-top: 2.5rem;
            max-width: 600px; margin-left: auto; margin-right: auto;
        }
        .feature {
            background: rgba(255,255,255,0.08);
            padding: 1.5rem 1rem;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            cursor: pointer;
        }
        .feature:hover { transform: translateY(-8px) scale(1.05); background: rgba(255,255,255,0.15); }
        .feature-icon { font-size: 2.5rem; margin-bottom: 0.8rem; display: inline-block; animation: bounce 2s ease-in-out infinite; }
        .feature:nth-child(1) .feature-icon { animation-delay: 0s; }
        .feature:nth-child(2) .feature-icon { animation-delay: 0.2s; }
        .feature:nth-child(3) .feature-icon { animation-delay: 0.4s; }
        .feature:nth-child(4) .feature-icon { animation-delay: 0.6s; }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .feature-text { font-size: 0.95rem; font-weight: 600; }

        /* Nav */
        .nav {
            background: var(--card-bg);
            box-shadow: var(--shadow-md);
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-around;
            padding: 1rem; gap: 1rem;
            margin: 0 1rem; margin-top: -30px;
            border-radius: 25px;
        }
        .nav-btn {
            flex: 1; padding: 1rem 1.5rem;
            background: var(--bg); border: 2px solid transparent;
            font-size: 1.05rem; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            border-radius: 15px; font-weight: 700;
            color: var(--text-light); position: relative; overflow: hidden;
        }
        .nav-btn::before {
            content: '';
            position: absolute; top: 50%; left: 50%;
            width: 0; height: 0; border-radius: 50%;
            background: var(--gradient-1);
            transition: all 0.5s;
            transform: translate(-50%,-50%);
        }
        .nav-btn.active::before { width: 300%; height: 300%; }
        .nav-btn span { position: relative; z-index: 1; }
        .nav-btn.active { color: var(--secondary); border-color: var(--primary); }
        .nav-btn:hover:not(.active) { transform: translateY(-3px); box-shadow: var(--shadow-sm); background: white; }

        /* Sections */
        .section { display: none; padding: 2rem 1.5rem; animation: fadeInUp 0.6s cubic-bezier(0.4,0,0.2,1); }
        .section.active { display: block; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Map */
        #map {
            height: 450px; border-radius: 25px;
            box-shadow: var(--shadow-lg); margin-bottom: 2rem;
            border: 4px solid white; overflow: hidden;
        }

        /* Form */
        .form-card { background: var(--card-bg); padding: 2rem; border-radius: 25px; box-shadow: var(--shadow-md); }
        .form-group { margin-bottom: 1.8rem; }
        label {
            display: block; margin-bottom: 0.8rem;
            font-weight: 700; color: var(--secondary); font-size: 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        input, textarea, select {
            width: 100%; padding: 1.2rem 1.5rem;
            border: 2px solid #E8ECF1; border-radius: 15px;
            font-size: 1.05rem; transition: all 0.3s;
            font-family: inherit; background: var(--bg);
        }
        input:focus, textarea:focus, select:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(255,184,0,0.1);
            background: white; transform: translateY(-2px);
        }
        textarea { resize: vertical; min-height: 120px; }

        .location-btn {
            width: 100%; padding: 1.3rem;
            background: var(--gradient-2); color: white; border: none;
            border-radius: 15px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; margin-bottom: 1.2rem;
            display: flex; align-items: center; justify-content: center; gap: 0.8rem;
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            box-shadow: 0 8px 20px rgba(102,126,234,0.3);
        }
        .location-btn:hover { transform: translateY(-5px); box-shadow: 0 12px 35px rgba(102,126,234,0.4); }

        #selectedLocation {
            color: var(--success); font-weight: 700; text-align: center;
            padding: 1rem; background: rgba(46,204,113,0.1);
            border-radius: 12px; margin-top: 1rem;
            animation: slideIn 0.5s;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .submit-btn {
            width: 100%; padding: 1.5rem;
            background: var(--gradient-1); color: var(--secondary); border: none;
            border-radius: 18px; font-size: 1.2rem; font-weight: 800;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            box-shadow: 0 10px 30px rgba(255,184,0,0.4);
        }
        .submit-btn:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 15px 45px rgba(255,184,0,0.5); }
        .submit-btn:active { transform: translateY(-2px) scale(0.98); }

        /* Driver */
        .password-container {
            background: var(--card-bg); padding: 3rem 2rem;
            border-radius: 30px; box-shadow: var(--shadow-lg);
            max-width: 450px; margin: 0 auto; text-align: center;
        }
        .password-container h2 { font-size: 2rem; margin-bottom: 2rem; color: var(--secondary); font-weight: 800; }
        .lock-icon { font-size: 5rem; margin-bottom: 1.5rem; animation: swing 2s ease-in-out infinite; }
        @keyframes swing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
        }

        .requests-container { display: none; }
        .requests-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 2rem; padding: 1.5rem;
            background: var(--gradient-1); border-radius: 20px; color: var(--secondary);
        }
        .requests-count { font-size: 2.5rem; font-weight: 800; }

        /* ── الكارد بدون أي حركة تُعيد الرسم ── */
        .request-card {
            background: var(--card-bg); padding: 2rem; border-radius: 25px;
            margin-bottom: 1.5rem; box-shadow: var(--shadow-md);
            border-right: 6px solid var(--primary);
            transition: box-shadow 0.3s, transform 0.3s;
            position: relative; overflow: hidden;
        }
        .request-card:hover { transform: translateX(-8px) translateY(-5px); box-shadow: var(--shadow-lg); }

        /* ── بادج "جديد" يظهر للطلبات التي وصلت بعد الدخول ── */
        .new-badge {
            position: absolute; top: 16px; left: 16px;
            background: #FF6B6B; color: white;
            font-size: 0.8rem; font-weight: 700;
            padding: 4px 12px; border-radius: 20px;
            animation: badge-pulse 1.5s ease-in-out infinite;
        }
        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .request-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem; padding-bottom: 1.5rem;
            border-bottom: 3px solid var(--bg);
        }
        .request-id {
            font-weight: 800;
            background: var(--gradient-3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text; font-size: 1.3rem;
        }
        .request-time { font-size: 0.9rem; color: var(--text-light); background: var(--bg); padding: 0.5rem 1rem; border-radius: 20px; }

        .request-detail {
            margin-bottom: 1.2rem; display: flex; gap: 1rem;
            padding: 0.8rem; background: var(--bg); border-radius: 12px;
            transition: background 0.3s;
        }
        .request-detail:hover { background: #f0f1f5; }
        .detail-label { font-weight: 700; color: var(--secondary); min-width: 100px; display: flex; align-items: center; gap: 0.5rem; }
        .detail-value { color: var(--text); flex: 1; }

        .accept-btn {
            width: 100%; padding: 1.3rem; background: var(--success);
            color: white; border: none; border-radius: 15px;
            font-weight: 800; font-size: 1.1rem; cursor: pointer;
            margin-top: 1.5rem; transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(46,204,113,0.3);
        }
        .accept-btn:hover { background: #27AE60; transform: translateY(-3px); }
        .accept-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.8rem 1.5rem; border-radius: 25px;
            font-size: 0.95rem; font-weight: 700; box-shadow: var(--shadow-sm);
        }
        .status-pending { background: linear-gradient(135deg,#fff3cd,#ffe69c); color: #856404; }

        /* ── شريط تحديث خفيف بدون إعادة رسم ── */
        .update-bar {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.8rem 1.2rem; margin-bottom: 1.5rem;
            background: rgba(46,204,113,0.08);
            border: 1px solid rgba(46,204,113,0.2);
            border-radius: 12px; font-size: 0.9rem; color: var(--text-light);
        }
        .update-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--success);
            animation: live-pulse 2s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes live-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Notification */
        .notification {
            position: fixed; top: 30px; left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg); padding: 1.5rem 2.5rem;
            border-radius: 20px; box-shadow: var(--shadow-lg);
            z-index: 1000; display: none; max-width: 90%;
            animation: notifSlide 0.5s cubic-bezier(0.68,-0.55,0.265,1.55);
            font-weight: 600;
        }
        @keyframes notifSlide {
            from { transform: translate(-50%,-150px) scale(0.8); opacity: 0; }
            to { transform: translate(-50%,0) scale(1); opacity: 1; }
        }
        .notification.success { border-right: 6px solid var(--success); background: linear-gradient(135deg,#fff,#f0fff4); }
        .notification.error { border-right: 6px solid #e74c3c; background: linear-gradient(135deg,#fff,#fff5f5); }

        /* Loading */
        .loading { display: none; text-align: center; padding: 3rem; }
        .spinner { border: 5px solid var(--bg); border-top: 5px solid var(--primary); border-radius: 50%; width: 60px; height: 60px; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { margin-top: 1.5rem; color: var(--text-light); font-weight: 600; }

        .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text-light); }
        .empty-state-icon { font-size: 6rem; margin-bottom: 1.5rem; opacity: 0.4; animation: float 3s ease-in-out infinite; }
        .empty-state-text { font-size: 1.2rem; font-weight: 600; }

        @media (max-width: 480px) {
            .hero h1 { font-size: 2.2rem; }
            .features { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .nav { margin: 0 0.5rem; margin-top: -20px; padding: 0.8rem; gap: 0.5rem; }
            .nav-btn { padding: 0.8rem 1rem; font-size: 0.95rem; }
            #map { height: 350px; }
        }
    </style>
</head>
<body>

<div class="hero">
    <div class="hero-content">
        <div class="taxi-icon-container">
            <div class="taxi-glow"></div>
            <div class="taxi-icon">🚖</div>
        </div>
        <h1>تكسي طولكرم</h1>
        <p class="hero-subtitle">خدمتك في أي وقت، في أي مكان</p>
        <p>احجز تكسي بكل سهولة وأمان من هاتفك المحمول</p>
        <p>خدمة توصيل سريعة ومريحة متاحة على مدار الساعة</p>
        <div class="features">
            <div class="feature"><div class="feature-icon">⚡</div><div class="feature-text">سريع وآمن</div></div>
            <div class="feature"><div class="feature-icon">💰</div><div class="feature-text">أسعار مناسبة</div></div>
            <div class="feature"><div class="feature-icon">📍</div><div class="feature-text">تتبع مباشر</div></div>
            <div class="feature"><div class="feature-icon">⭐</div><div class="feature-text">خدمة ممتازة</div></div>
        </div>
    </div>
</div>

<div class="nav">
    <button class="nav-btn active" onclick="showSection('request')"><span>🚕 طلب تكسي</span></button>
    <button class="nav-btn" onclick="showSection('driver')"><span>👨‍✈️ السائق</span></button>
</div>

<div id="notification" class="notification"></div>

<!-- Request Section -->
<div id="request-section" class="section active">
    <div id="map"></div>
    <div class="form-card">
        <form id="requestForm">
            <div class="form-group">
                <button type="button" class="location-btn" onclick="selectLocationOnMap()">
                    <span>📍</span><span>حدد موقعك على الخريطة</span>
                </button>
                <input type="hidden" id="selectedLat" required>
                <input type="hidden" id="selectedLng" required>
                <div id="selectedLocation"></div>
            </div>
            <div class="form-group">
                <label><span>📱</span> رقم الهاتف</label>
                <input type="tel" id="phone" placeholder="05xxxxxxxx" required pattern="[0-9]{10}">
            </div>
            <div class="form-group">
                <label><span>📍</span> موقعك الحالي (وصف)</label>
                <input type="text" id="currentLocation" placeholder="مثال: شارع الخضراء، قرب مسجد النور" required>
            </div>
            <div class="form-group">
                <label><span>🎯</span> إلى أين؟</label>
                <textarea id="destination" placeholder="مثال: مستشفى طولكرم الحكومي" required></textarea>
            </div>
            <div class="form-group">
                <label><span>👥</span> عدد الركاب</label>
                <select id="passengers" required>
                    <option value="">اختر عدد الركاب</option>
                    <option value="1">راكب واحد</option>
                    <option value="2">راكبان</option>
                    <option value="3">3 ركاب</option>
                    <option value="4">4 ركاب</option>
                    <option value="5+">أكثر من 4</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">🚖 اطلب تكسي الآن</button>
        </form>
    </div>
</div>

<!-- Driver Section -->
<div id="driver-section" class="section">
    <div class="password-container" id="passwordContainer">
        <div class="lock-icon">🔐</div>
        <h2>دخول السائق</h2>
        <div class="form-group">
            <label><span>🔑</span> كلمة المرور</label>
            <input type="password" id="driverPassword" placeholder="أدخل كلمة المرور"
                   onkeydown="if(event.key==='Enter') verifyDriver()">
        </div>
        <button class="submit-btn" onclick="verifyDriver()">دخول</button>
    </div>

    <div class="requests-container" id="requestsContainer">
        <div class="requests-header">
            <div>
                <h2 style="margin:0;font-size:1.5rem;">📋 الطلبات الواردة</h2>
            </div>
            <div class="requests-count" id="requestsCount">0</div>
        </div>

        <!-- شريط "مباشر" يُثبت للسائق أن الاتصال حي -->
        <div class="update-bar">
            <div class="update-dot"></div>
            <span>مباشر — يتم تحديث الطلبات تلقائياً فور ورودها</span>
            <span id="lastUpdateTime" style="margin-right:auto;font-size:0.8rem;"></span>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">جاري تحميل الطلبات...</p>
        </div>
        <div id="requestsList"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ─────────────────────────────────────────────
   Firebase Config
───────────────────────────────────────────── */
const FIREBASE_URL = 'https://tiksehamod-default-rtdb.firebaseio.com';
const ENCODED_PASSWORD = btoa('1230964');

/* ─────────────────────────────────────────────
   Map
───────────────────────────────────────────── */
let map, marker, selectingLocation = false;

function initMap() {
    map = L.map('map').setView([32.3117, 35.0278], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    map.on('click', function(e) {
        if (selectingLocation) setLocation(e.latlng.lat, e.latlng.lng);
    });
}

function selectLocationOnMap() {
    selectingLocation = true;
    showNotification('اضغط على الخريطة لتحديد موقعك', 'success');
}

function setLocation(lat, lng) {
    if (marker) map.removeLayer(marker);
    marker = L.marker([lat, lng]).addTo(map);
    document.getElementById('selectedLat').value = lat;
    document.getElementById('selectedLng').value = lng;
    document.getElementById('selectedLocation').textContent =
        `✅ تم تحديد الموقع: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    selectingLocation = false;
    map.setView([lat, lng], 15);
}

/* ─────────────────────────────────────────────
   Customer: Submit Request
───────────────────────────────────────────── */
document.getElementById('requestForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    if (!document.getElementById('selectedLat').value) {
        showNotification('⚠️ يرجى تحديد موقعك على الخريطة أولاً', 'error');
        return;
    }

    const submitBtn = this.querySelector('.submit-btn');
    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ جاري الإرسال...';

    const requestData = {
        phone:           document.getElementById('phone').value,
        currentLocation: document.getElementById('currentLocation').value,
        destination:     document.getElementById('destination').value,
        passengers:      document.getElementById('passengers').value,
        latitude:        document.getElementById('selectedLat').value,
        longitude:       document.getElementById('selectedLng').value,
        timestamp:       new Date().toISOString(),
        status:          'pending',
        requestId:       'REQ' + Date.now()
    };

    try {
        const response = await fetch(`${FIREBASE_URL}/requests.json`, {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify(requestData)
        });

        if (response.ok) {
            const data = await response.json();
            showNotification('✅ تم إرسال طلبك بنجاح! سيصلك التكسي قريباً', 'success');
            this.reset();
            document.getElementById('selectedLocation').textContent = '';
            if (marker) { map.removeLayer(marker); marker = null; }
            document.getElementById('selectedLat').value = '';
            document.getElementById('selectedLng').value = '';
            listenForAcceptance(data.name);
        } else {
            showNotification('❌ حدث خطأ في إرسال الطلب، يرجى المحاولة مرة أخرى', 'error');
        }
    } catch (error) {
        showNotification('❌ خطأ في الاتصال بالخادم', 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '🚖 اطلب تكسي الآن';
    }
});

/* ─────────────────────────────────────────────
   Customer: Listen for acceptance (SSE)
   — يستخدم Firebase SSE بدل polling
───────────────────────────────────────────── */
function listenForAcceptance(firebaseKey) {
    const url = `${FIREBASE_URL}/requests/${firebaseKey}.json`;
    const source = new EventSource(url);
    const timeout = setTimeout(() => source.close(), 300000); // 5 دقائق

    source.addEventListener('put', function(e) {
        try {
            const payload = JSON.parse(e.data);
            const data = payload.data;
            if (data && data.status === 'accepted') {
                clearTimeout(timeout);
                source.close();
                showNotification('🎉 تم قبول طلبك! التكسي في الطريق إليك', 'success');
            }
        } catch(_) {}
    });

    source.onerror = function() { source.close(); clearTimeout(timeout); };
}

/* ─────────────────────────────────────────────
   Driver: Login
───────────────────────────────────────────── */
function verifyDriver() {
    const password = document.getElementById('driverPassword').value;
    if (btoa(password) === ENCODED_PASSWORD) {
        document.getElementById('passwordContainer').style.display = 'none';
        document.getElementById('requestsContainer').style.display  = 'block';
        loadRequestsOnce();          // تحميل أولي
        startFirebaseSSEDriver();    // ثم مستمع مباشر بدون polling
    } else {
        showNotification('❌ كلمة المرور غير صحيحة', 'error');
    }
}

/* ─────────────────────────────────────────────
   Driver: حالة القائمة المحلية (لا تُعيد رسم كامل)
───────────────────────────────────────────── */

// خريطة الطلبات الموجودة حالياً  key→ requestData
const knownRequests = new Map();
// وقت دخول السائق لنعرف الطلبات "الجديدة"
const driverLoginTime = Date.now();

/* ── التحميل الأولي ── */
async function loadRequestsOnce() {
    const loading      = document.getElementById('loading');
    const requestsList = document.getElementById('requestsList');

    loading.style.display = 'block';
    requestsList.innerHTML = '';

    try {
        const res  = await fetch(`${FIREBASE_URL}/requests.json`);
        const data = await res.json();
        loading.style.display = 'none';

        if (!data) { renderEmpty(); return; }

        const pending = Object.entries(data)
            .filter(([, r]) => r.status === 'pending')
            .sort((a, b) => new Date(b[1].timestamp) - new Date(a[1].timestamp));

        if (pending.length === 0) { renderEmpty(); return; }

        pending.forEach(([key, req]) => {
            knownRequests.set(key, req);
            requestsList.insertAdjacentHTML('beforeend', buildCardHTML(key, req, false));
        });

        updateCount();
        updateLastTime();

    } catch (_) {
        loading.style.display = 'none';
        renderError();
    }
}

/* ── Firebase SSE للسائق — يستمع لأي تغيير ── */
function startFirebaseSSEDriver() {
    const source = new EventSource(`${FIREBASE_URL}/requests.json`);

    source.addEventListener('put', function(e) {
        handleFirebaseEvent(JSON.parse(e.data));
    });

    source.addEventListener('patch', function(e) {
        handleFirebaseEvent(JSON.parse(e.data));
    });

    source.onerror = function() {
        // إذا انقطع الاتصال، حاول مرة أخرى بعد 5 ثوانٍ
        setTimeout(startFirebaseSSEDriver, 5000);
        source.close();
    };
}

/* ── معالجة الحدث من Firebase ── */
function handleFirebaseEvent(payload) {
    if (!payload || !payload.data) return;

    const path = payload.path || '/';
    const data = payload.data;

    // حدث كامل (المسار = /)
    if (path === '/') {
        if (!data) { knownRequests.clear(); renderEmpty(); return; }

        Object.entries(data).forEach(([key, req]) => {
            if (req.status === 'pending') {
                if (!knownRequests.has(key)) {
                    // طلب جديد → أضفه للأعلى بدون مسح باقي القائمة
                    knownRequests.set(key, req);
                    addCardToTop(key, req);
                }
            } else if (req.status === 'accepted') {
                // طلب قُبل → أزله بنعومة
                if (knownRequests.has(key)) {
                    knownRequests.delete(key);
                    removeCard(key);
                }
            }
        });

        updateCount();
        updateLastTime();
        return;
    }

    // حدث لطلب محدد (المسار = /KEY أو /KEY/status)
    const parts = path.split('/').filter(Boolean);
    const key   = parts[0];

    if (parts.length === 1) {
        // تغيّر الطلب كاملاً
        if (!data || data.status === 'accepted') {
            if (knownRequests.has(key)) { knownRequests.delete(key); removeCard(key); }
        } else if (data.status === 'pending' && !knownRequests.has(key)) {
            knownRequests.set(key, data);
            addCardToTop(key, data);
        }
    } else if (parts.length === 2 && parts[1] === 'status' && data === 'accepted') {
        if (knownRequests.has(key)) { knownRequests.delete(key); removeCard(key); }
    }

    updateCount();
    updateLastTime();
}

/* ── إضافة كارد جديد للأعلى (بدون مسح القائمة) ── */
function addCardToTop(key, req) {
    const requestsList = document.getElementById('requestsList');
    const empty = requestsList.querySelector('.empty-state');
    if (empty) empty.remove();

    // إظهار إشعار صوتي/بصري
    showNotification('🔔 طلب جديد وصل!', 'success');

    const div = document.createElement('div');
    div.innerHTML = buildCardHTML(key, req, true);
    requestsList.insertBefore(div.firstElementChild, requestsList.firstChild);
}

/* ── إزالة كارد بنعومة ── */
function removeCard(key) {
    const card = document.getElementById(`card-${key}`);
    if (!card) return;

    card.style.transition  = 'opacity 0.5s, transform 0.5s';
    card.style.opacity     = '0';
    card.style.transform   = 'translateX(40px)';

    setTimeout(() => {
        card.remove();
        if (knownRequests.size === 0) renderEmpty();
    }, 500);
}

/* ── بناء HTML الكارد ── */
function buildCardHTML(key, req, isNew) {
    const date   = new Date(req.timestamp);
    const newBadge = isNew ? '<span class="new-badge">جديد 🆕</span>' : '';
    const mapsLink = req.latitude && req.longitude
        ? `<a href="https://www.google.com/maps?q=${req.latitude},${req.longitude}"
              target="_blank"
              style="color:var(--primary);font-weight:700;font-size:0.9rem;">
              🗺️ فتح في الخريطة
           </a>`
        : '';

    return `
    <div class="request-card" id="card-${key}">
        ${newBadge}
        <div class="request-header">
            <div class="request-id">${escapeHTML(req.requestId || key)}</div>
            <div class="request-time">⏰ ${date.toLocaleString('ar')}</div>
        </div>
        <div class="request-detail">
            <span class="detail-label">📱 الهاتف:</span>
            <span class="detail-value">
                <a href="tel:${escapeHTML(req.phone)}" style="color:var(--primary);font-weight:700;">
                    ${escapeHTML(req.phone)}
                </a>
            </span>
        </div>
        <div class="request-detail">
            <span class="detail-label">📍 الموقع:</span>
            <span class="detail-value">${escapeHTML(req.currentLocation)}</span>
        </div>
        <div class="request-detail">
            <span class="detail-label">🎯 الوجهة:</span>
            <span class="detail-value">${escapeHTML(req.destination)}</span>
        </div>
        <div class="request-detail">
            <span class="detail-label">👥 الركاب:</span>
            <span class="detail-value">${escapeHTML(String(req.passengers))}</span>
        </div>
        ${req.latitude ? `
        <div class="request-detail">
            <span class="detail-label">🗺️ موقع GPS:</span>
            <span class="detail-value">${mapsLink}</span>
        </div>` : ''}
        <div style="margin-top:1rem;">
            <span class="status-badge status-pending">⏳ قيد الانتظار</span>
        </div>
        <button class="accept-btn" id="btn-${key}" onclick="acceptRequest('${key}')">
            ✅ قبول الطلب
        </button>
    </div>`;
}

/* ── قبول الطلب ── */
async function acceptRequest(key) {
    const btn = document.getElementById(`btn-${key}`);
    if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري القبول...'; }

    try {
        const res = await fetch(`${FIREBASE_URL}/requests/${key}.json`, {
            method:  'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ status: 'accepted' })
        });

        if (res.ok) {
            showNotification('✅ تم قبول الطلب بنجاح', 'success');
            // الكارد سيختفي تلقائياً من SSE listener
        } else {
            showNotification('❌ حدث خطأ في قبول الطلب', 'error');
            if (btn) { btn.disabled = false; btn.textContent = '✅ قبول الطلب'; }
        }
    } catch (_) {
        showNotification('❌ خطأ في الاتصال بالخادم', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✅ قبول الطلب'; }
    }
}

/* ── مساعدات ── */
function updateCount() {
    document.getElementById('requestsCount').textContent = knownRequests.size;
}

function updateLastTime() {
    const el = document.getElementById('lastUpdateTime');
    if (el) el.textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar');
}

function renderEmpty() {
    const requestsList = document.getElementById('requestsList');
    requestsList.innerHTML = `
        <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <p class="empty-state-text">لا توجد طلبات حالياً</p>
        </div>`;
    document.getElementById('requestsCount').textContent = '0';
}

function renderError() {
    document.getElementById('requestsList').innerHTML = `
        <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p class="empty-state-text">حدث خطأ في تحميل الطلبات</p>
        </div>`;
}

function escapeHTML(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
}

/* ─────────────────────────────────────────────
   Navigation
───────────────────────────────────────────── */
function showSection(section) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

    if (section === 'request') {
        document.getElementById('request-section').classList.add('active');
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        setTimeout(() => { if (map) map.invalidateSize(); }, 100);
    } else {
        document.getElementById('driver-section').classList.add('active');
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
    }
}

/* ─────────────────────────────────────────────
   Notification
───────────────────────────────────────────── */
let notifTimer;
function showNotification(message, type) {
    clearTimeout(notifTimer);
    const n = document.getElementById('notification');
    n.textContent = message;
    n.className   = `notification ${type}`;
    n.style.display = 'block';
    notifTimer = setTimeout(() => { n.style.display = 'none'; }, 5000);
}

/* ─────────────────────────────────────────────
   Init
───────────────────────────────────────────── */
window.onload = initMap;
</script>
